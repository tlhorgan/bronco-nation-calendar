name: Update Bronco Nation Calendar

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate combined source calendar
        run: |
          python generate_calendar.py

      - name: Split Bronco calendars
        run: |
          python split_bronco_calendars.py

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bronco-nation.ics other-bronco-events.ics

          git diff --cached --quiet || \
            git commit -m "Update Bronco Nation and other Bronco calendars"

          git push
